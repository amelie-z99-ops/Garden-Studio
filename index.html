<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14231a"><title>Garden Studio</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#edf4e9;background:#101a14;color-scheme:dark}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.4}header{padding:calc(env(safe-area-inset-top, 0px) + 82px) 20px 12px;max-width:900px;margin:auto}h1{font-size:28px;margin:3px 0}h2{font-size:21px;margin:0 0 15px}h3{margin:0 0 9px;font-size:17px}p{line-height:1.5}.muted{color:#9db19f}.tiny{font-size:12px}.eyebrow{font-size:11px;letter-spacing:2px;color:#a6caa7}main{max-width:900px;margin:auto;padding:10px 16px 100px}.card{background:#1d2c21;border:1px solid #334737;border-radius:17px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{font-size:28px;font-weight:700;margin-top:6px}.btn{background:#a5d0a7;color:#14251a;border:0;border-radius:12px;padding:11px 15px;font-weight:650}.btn.secondary{background:#304535;color:#e2f1e1}.btn.ghost{background:transparent;border:1px solid #49604c;color:#e2f1e1}.btn.danger{background:#573333;color:#ffe6e1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.nav{position:fixed;bottom:0;left:0;right:0;background:#17261b;border-top:1px solid #354738;display:flex;justify-content:space-around;padding:9px 4px max(12px,env(safe-area-inset-bottom));z-index:10}.nav button{background:none;border:0;color:#93ab98;font-size:11px;display:flex;flex-direction:column;gap:4px;align-items:center;min-width:60px}.nav button.active{color:#b8e4b6}.nav b{font-size:21px;font-weight:400}.pill{display:inline-block;border-radius:50px;background:#344c39;color:#d6edd5;padding:4px 10px;font-size:12px;margin:3px 4px 3px 0}.plantgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.plantcard{background:#1d2c21;border:1px solid #334737;border-radius:16px;overflow:hidden;text-align:left;color:inherit;padding:0}.plantcard img{width:100%;height:150px;object-fit:cover}.placeholder{height:150px;display:grid;place-items:center;background:#304735;font-size:48px}.plantcard .inner{padding:12px}.plantcard strong{display:block}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.row.wrap{flex-wrap:wrap}.field{display:block;margin:13px 0}.field span{display:block;font-size:13px;color:#c2d6c1;margin-bottom:6px}input,textarea,select{width:100%;border:1px solid #49604d;background:#142118;color:#f0f7ed;border-radius:10px;padding:11px;min-height:42px}textarea{min-height:76px;resize:vertical}input[type=checkbox]{width:auto;min-height:0;accent-color:#a8d3a8}input[type=file]{font-size:13px}.checks{display:flex;gap:7px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:5px;background:#304436;padding:8px;border-radius:10px;font-size:12px}.check input{margin:0}.taskline{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #3b503e}.taskline:last-child{border:0}.taskline input{width:21px;height:21px}.taskline .grow{flex:1}.month{border:1px solid #3a503e;border-radius:13px;margin-bottom:10px;overflow:hidden}.month summary{padding:15px;cursor:pointer;display:flex;justify-content:space-between;list-style:none}.month summary::-webkit-details-marker{display:none}.monthbody{padding:0 13px 12px}.taskgroup{margin:10px 0;border:1px solid #3b503e;border-radius:11px;padding:12px}.taskgroup summary{cursor:pointer;font-weight:600}.photo{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.photogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.photoitem{font-size:11px;overflow-wrap:anywhere}.hide{display:none!important}.empty{text-align:center;padding:30px 16px;color:#a9bdab}.dialog{border:1px solid #4d6651;background:#1a2a20;color:#edf4e9;border-radius:18px;width:min(95vw,680px);max-height:90vh;overflow:auto;padding:20px}.dialog::backdrop{background:#000b}.dialog header{padding:0;display:flex;justify-content:space-between;align-items:center}.dialog header button{background:transparent;border:0;color:white;font-size:25px}.note{background:#293b2d;border-radius:12px;padding:12px;color:#bcd5bd;font-size:13px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(min-width:650px){.plantgrid{grid-template-columns:repeat(3,1fr)}.plantcard img,.placeholder{height:200px}}@media(max-width:420px){.nav button{min-width:48px}.photogrid{grid-template-columns:repeat(2,1fr)}}
fieldset.choicefield{border:0;padding:0;margin:18px 0}fieldset.choicefield legend{font-size:13px;color:#c2d6c1;margin-bottom:9px}.choicefield .check{position:relative;min-width:72px;justify-content:center;padding:10px 11px;border:1px solid #45614a;cursor:pointer}.choicefield .check:has(input:checked){background:#42694a;border-color:#a5d0a7;color:#fff}.choicefield .check input{position:absolute;opacity:0;width:1px;height:1px}.choicefield .check span{display:inline!important;margin:0!important;color:inherit!important;font-size:13px!important}.dialog{max-height:calc(100dvh - env(safe-area-inset-top,0px) - 76px);margin-top:calc(env(safe-area-inset-top,0px) + 55px);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}@media(display-mode:standalone){body>header{padding-top:calc(env(safe-area-inset-top,0px) + 45px)}}
.mapframe{position:relative;width:100%;background:white;border-radius:12px;overflow:hidden}.mapframe img{display:block;width:100%;height:auto;pointer-events:none}.mapmark{position:absolute;transform:translate(-50%,-50%);border:2px solid #fff;border-radius:50%;background:#263f30;color:white;width:32px;height:32px;padding:0;display:grid;place-items:center;font-size:17px;box-shadow:0 2px 7px #0008;z-index:2}.mapframe.picking{outline:2px solid #a5d0a7;touch-action:manipulation}#editor-map .mapmark{pointer-events:none}.maptools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.maptools select{flex:1;min-width:125px}.mapnote{font-size:12px;color:#aac2ad;margin:8px 0}@media(max-width:450px){dialog{width:calc(100vw - 20px);padding:14px}} 
.markerphoto{display:block;width:100%;height:100%;object-fit:cover;border-radius:50%}.mapmark{overflow:hidden}.existingmark{pointer-events:none;opacity:.87;border-color:#d4e6d3}.iconrow{display:flex;gap:12px;align-items:center}.iconpreview{flex:none;width:76px;height:76px;border-radius:14px;background:#304735;display:grid;place-items:center;overflow:hidden;font-size:34px}.iconpreview img{width:100%;height:100%;object-fit:cover}.iconrow .grow{min-width:0;flex:1}.iconrow .btn{margin-top:8px}#cropwrap[hidden]{display:none}#cropcanvas{display:block;width:min(240px,100%);aspect-ratio:1;object-fit:contain;border:2px solid #a5d0a7;border-radius:10px;touch-action:manipulation;cursor:crosshair;margin:12px 0}.fertline{font-size:12px;color:#b5d9a6;margin-top:5px}.dialog{scroll-padding-top:25px}
</style><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.warn))}</script></head><body><header><div class="eyebrow">MEIN GARTEN</div><h1>Garden Studio <span style="color:#a5d0a7">✿</span></h1><div class="muted tiny">Deine Pflanzen. Dein Gartenjahr.</div></header><main id="app"></main><nav class="nav" id="nav"></nav><dialog class="dialog" id="dialog"><header><h2 id="dialogtitle"></h2><button onclick="closeDialog()" aria-label="Schließen">×</button></header><div id="dialogbody"></div></dialog><script>
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];const TYPES=['Baum','Strauch','Staude','Hecke','Kletterpflanze','Zwiebelpflanze','Gras','Obst','Gemüse','Sonstige'];const TASKS=['Düngen','Formschnitt','Rückschnitt','Gießen','Mulchen','Winterschutz','Umtopfen','Ernte','Pflanzenschutz'];const FIELDS=[['standort','Standort im Garten'],['licht','Licht','Sonne|Halbschatten|Schatten'],['wind','Wind','Geschützt|Halb|Offen'],['groesse','Wuchshöhe','Gering|Mittel|Hoch'],['wasser','Wasserbedarf','Gering|Mittel|Hoch'],['winter','Winterhärte','Ja|Bedingt|Nein'],['winterschutz','Winterschutz'],['schnittmonate','Formschnitt','@months'],['bluetemonate','Blütezeit','@months'],['bluete','Blütenfarbe','Weiß|Gelb|Orange|Rot|Rosa|Lila|Blau|Grün|Schwarz'],['blatt','Laubverhalten','Immergrün|Wintergrün|Sommergrün'],['herbst','Herbstfärbung','Keine|Gelb|Orange|Rot|Violett'],['notizen','Notizen']];const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toLocaleDateString('sv-SE');let db,plants=[],templates=[],assignments=[],completions=[],view='home',year=new Date().getFullYear(),selectedPlant=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('garden-studio-v1',1);r.onupgradeneeded=()=>{for(const n of ['plants','templates','assignments','completions'])r.result.createObjectStore(n,{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function all(n){return new Promise((res,rej)=>{let r=db.transaction(n).objectStore(n).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}function put(n,v){return new Promise((res,rej)=>{let r=db.transaction(n,'readwrite').objectStore(n).put(v);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}function del(n,id){return new Promise((res,rej)=>{let r=db.transaction(n,'readwrite').objectStore(n).delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}async function refresh(){[plants,templates,assignments,completions]=await Promise.all(['plants','templates','assignments','completions'].map(all));render()};function setView(v){view=v;selectedPlant=null;render();scrollTo(0,0)}function openDialog(title,html){document.getElementById('dialogtitle').textContent=title;document.getElementById('dialogbody').innerHTML=html;document.getElementById('dialog').showModal()}function closeDialog(){document.getElementById('dialog').close()};function plantName(id){return plants.find(p=>p.id===id)?.name||'Unbekannte Pflanze'}function taskName(id){return templates.find(t=>t.id===id)?.name||'Aufgabe'}function active(a,m){return (a.months||[]).includes(m)}function done(a,m,y){return completions.find(c=>c.assignmentId===a.id&&c.month===m&&c.year===y)}function counts(m,y){const a=assignments.filter(a=>active(a,m));return {total:a.length,done:a.filter(a=>done(a,m,y)).length}}function nav(){let items=[['home','⌂','Start'],['plants','❀','Pflanzen'],['tasks','▦','Aufgaben'],['map','🌿','Karte'],['history','◷','Rückblick'],['more','⋯','Mehr']];document.getElementById('nav').innerHTML=items.map(([id,ico,label])=>`<button class="${view===id?'active':''}" onclick="setView('${id}')"><b>${ico}</b>${label}</button>`).join('')};function render(){nav();let app=document.getElementById('app');app.innerHTML=view==='home'?home():view==='plants'?plantList():view==='tasks'?taskPage():view==='map'?mapPage():view==='history'?historyPage():morePage()}

let iconCropState=null;
function plantMarker(p){return p.iconPhoto?`<img class="markerphoto" src="${p.iconPhoto}" alt="">`:plantIcon(p)}
function editorMarkers(currentId){return plants.filter(p=>p.position&&p.id!==currentId).map(p=>`<span class="mapmark existingmark" title="${esc(p.name)}" style="left:${p.position.x}%;top:${p.position.y}%">${plantMarker(p)}</span>`).join('')}
function updateIconPreview(src){const el=document.getElementById('iconpreview');if(el)el.innerHTML=src?`<img src="${src}" alt="Vorschau Pflanzensymbol">`:'🌱'}
async function chooseIconFile(input){const file=input.files?.[0];if(!file)return;try{const url=await imageData(file);iconCropState={src:url,zoom:1,x:.5,y:.5};document.getElementById('cropwrap').hidden=false;const im=document.getElementById('cropimage');im.onload=()=>drawIconCrop();im.src=url;drawIconCrop()}catch(err){alert('Bild konnte nicht geöffnet werden: '+err.message)}}
function drawIconCrop(){if(!iconCropState)return;const im=document.getElementById('cropimage');if(!im.complete||!im.naturalWidth)return;const c=document.getElementById('cropcanvas'),ctx=c.getContext('2d'),z=iconCropState.zoom;const size=Math.min(im.naturalWidth,im.naturalHeight)/z;const sx=Math.max(0,Math.min(im.naturalWidth-size,iconCropState.x*im.naturalWidth-size/2));const sy=Math.max(0,Math.min(im.naturalHeight-size,iconCropState.y*im.naturalHeight-size/2));ctx.clearRect(0,0,240,240);ctx.drawImage(im,sx,sy,size,size,0,0,240,240)}
function iconZoom(v){if(!iconCropState)return;iconCropState.zoom=+v;drawIconCrop()}
function cropMove(e){if(!iconCropState)return;const r=e.currentTarget.getBoundingClientRect();iconCropState.x=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));iconCropState.y=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));drawIconCrop()}
function acceptIconCrop(){if(!iconCropState)return;drawIconCrop();const src=document.getElementById('cropcanvas').toDataURL('image/jpeg',.84);document.getElementById('iconvalue').value=src;updateIconPreview(src);document.getElementById('cropwrap').hidden=true;iconCropState=null}
function removeIconCrop(){document.getElementById('iconvalue').value='';document.getElementById('iconfile').value='';document.getElementById('cropwrap').hidden=true;iconCropState=null;updateIconPreview('')}
function pickPlantPosition(e){let r=e.currentTarget.getBoundingClientRect(),x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));let f=document.getElementById('plantform');f.elements.namedItem('mapx').value=x.toFixed(3);f.elements.namedItem('mapy').value=y.toFixed(3);let marker=document.getElementById('editor-marker');marker.style.display='grid';marker.style.left=x+'%';marker.style.top=y+'%'}
function clearPlantPosition(){let f=document.getElementById('plantform');f.elements.namedItem('mapx').value='';f.elements.namedItem('mapy').value='';document.getElementById('editor-marker').style.display='none'}
const MAP_ICONS={'Baum':'🌳','Strauch':'🌺','Staude':'🌸','Hecke':'🌿','Kletterpflanze':'🍃','Zwiebelpflanze':'🌷','Gras':'🌾','Obst':'🍎','Gemüse':'🥬','Sonstige':'🌱'};
function plantIcon(p){let n=(p.name+' '+p.variety).toLowerCase();if(n.includes('hortensie'))return '🌸';if(n.includes('rhododendron'))return '🌺';if(n.includes('eibe'))return '🌲';if(n.includes('hibiskus'))return '🌺';return MAP_ICONS[p.type]||'🌱'}
let mapFilterType='',mapFilterMonth='',mapEdit=false,movingPlant=null;
function mapPage(){let types=[...new Set(plants.map(p=>p.type).filter(Boolean))].sort();let visible=plants.filter(p=>p.position&&(!mapFilterType||p.type===mapFilterType)&&(!mapFilterMonth||assignments.some(a=>a.plantId===p.id&&(a.months||[]).includes(+mapFilterMonth-1))));return `<div class="row"><h2>Gartenkarte</h2><span class="pill">${visible.length} Pflanzen</span></div><div class="maptools"><select aria-label="Pflanzenart" onchange="mapFilterType=this.value;render()"><option value="">Alle Pflanzenarten</option>${types.map(t=>`<option value="${esc(t)}" ${mapFilterType===t?'selected':''}>${esc(t)}</option>`).join('')}</select><select aria-label="Aufgabenmonat" onchange="mapFilterMonth=this.value;render()"><option value="">Alle Aufgabenmonate</option>${MONTHS.map((m,i)=>`<option value="${i+1}" ${mapFilterMonth===String(i+1)?'selected':''}>Aufgaben im ${m}</option>`).join('')}</select></div><div class="mapframe ${mapEdit?'picking':''}" id="garden-map" onclick="moveOnMap(event)"><img src="gartenplan.jpg" alt="Gartenplan mit Hauptgarten oben und Vorgarten unten">${visible.map(p=>`<button class="mapmark" title="${esc(p.name)}" aria-label="${esc(p.name)}" style="left:${p.position.x}%;top:${p.position.y}%" onclick="mapMarkerClick(event,'${p.id}')">${plantMarker(p)}</button>`).join('')}</div><p class="mapnote">${mapEdit?'Bearbeiten: Tippe ein Symbol an und anschließend die neue Position.':'Tippe ein Pflanzensymbol an, um den Steckbrief zu öffnen.'}</p><div class="actions"><button class="btn secondary" onclick="mapEdit=!mapEdit;movingPlant=null;render()">${mapEdit?'Bearbeiten beenden':'Positionen bearbeiten'}</button><button class="btn ghost" onclick="plantEditor()">+ Pflanze</button></div>${!plants.some(p=>p.position)?'<div class="card"><p>Noch keine Pflanze positioniert. Lege eine Pflanze an oder öffne ihren Steckbrief und wähle „Bearbeiten“.</p></div>':''}`}
function mapMarkerClick(e,id){e.stopPropagation();if(!mapEdit){plantDetail(id);return}movingPlant=id;alert('Tippe jetzt auf die neue Position auf dem Gartenplan.')}
async function moveOnMap(e){if(!mapEdit||!movingPlant||e.target.closest('.mapmark'))return;let r=e.currentTarget.getBoundingClientRect(),p=plants.find(p=>p.id===movingPlant);if(!p)return;p.position={x:+(Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100))).toFixed(3),y:+(Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))).toFixed(3)};movingPlant=null;await put('plants',p);await refresh()}

function home(){let m=new Date().getMonth(),c=counts(m,year),due=assignments.filter(a=>active(a,m)&&!done(a,m,year));return `<div class="grid"><div class="card"><div class="muted tiny">PFLANZEN</div><div class="stat">${plants.length}</div></div><div class="card"><div class="muted tiny">OFFEN IM ${MONTHS[m].toUpperCase()}</div><div class="stat">${due.length}</div></div></div><div class="card"><div class="row"><h2>Dieser Monat</h2><span class="pill">${c.done}/${c.total} erledigt</span></div>${due.length?taskRows(due,m,year):'<div class="empty">🌱 Keine offenen Aufgaben in diesem Monat.</div>'}<div class="actions"><button class="btn secondary" onclick="setView('tasks')">Alle Monate ansehen</button><button class="btn secondary" onclick="setView('map')">Gartenkarte</button></div></div><div class="card"><div class="row"><h2>Meine Pflanzen</h2><button class="btn secondary" onclick="plantEditor()">+ Pflanze</button></div>${plants.length?`<div class="plantgrid">${plants.slice(0,4).map(plantCard).join('')}</div>`:'<div class="empty">Dein Garten wartet auf seine ersten Pflanzen.</div>'}</div>`}
function plantCard(p){return `<button class="plantcard" onclick="plantDetail('${p.id}')">${p.mainPhoto?`<img src="${p.mainPhoto}" alt="">`:'<div class="placeholder">🌿</div>'}<div class="inner"><strong>${esc(p.name)}</strong><span class="muted tiny">${esc(p.variety||p.type||'Pflanze')}</span></div></button>`}function plantList(){return `<div class="row"><h2>Pflanzenbibliothek <span class="muted">(${plants.length})</span></h2><button class="btn" onclick="plantEditor()">+ Neu</button></div><input id="search" placeholder="Pflanzen suchen ..." oninput="filterPlants(this.value)" style="margin-bottom:14px"><div id="plantresults" class="plantgrid">${plants.map(plantCard).join('')||'<div class="empty">Noch keine Pflanzen vorhanden.</div>'}</div>`}function filterPlants(s){document.getElementById('plantresults').innerHTML=plants.filter(p=>(p.name+' '+p.variety+' '+p.type).toLowerCase().includes(s.toLowerCase())).map(plantCard).join('')||'<div class="empty">Keine Treffer</div>'}
function fieldsHTML(p){return FIELDS.map(([key,label,opts])=>{let val=p?.fields?.[key]||'';if(opts){let choices=opts==='@months'?MONTHS.map((m,i)=>[String(i+1),m.slice(0,3)]):opts.split('|').map(x=>[x,x]);let selected=Array.isArray(val)?val:String(val).split(/[,|]/).map(x=>x.trim());return `<fieldset class="field choicefield"><legend>${esc(label)} · Mehrfachauswahl</legend><div class="checks">${choices.map(([v,l])=>`<label class="check"><input type="checkbox" data-field="${key}" value="${esc(v)}" ${selected.includes(v)?'checked':''}><span>${esc(l)}</span></label>`).join('')}</div></fieldset>`}return `<label class="field"><span>${esc(label)}</span><textarea data-field="${key}" rows="2" placeholder="Optional">${esc(val)}</textarea></label>`}).join('')}
function plantEditor(id){let p=plants.find(x=>x.id===id)||{};openDialog(id?'Pflanze bearbeiten':'Neue Pflanze',`<form id="plantform" onsubmit="savePlant(event,'${id||''}')"><label class="field"><span>Name *</span><input name="name" required value="${esc(p.name||'')}" placeholder="z. B. Rispenhortensie"></label><label class="field"><span>Botanischer Name / Sorte</span><input name="variety" value="${esc(p.variety||'')}"></label><label class="field"><span>Pflanzenart</span><select name="type"><option value="">Bitte wählen</option>${TYPES.map(t=>`<option ${p.type===t?'selected':''}>${t}</option>`).join('')}</select></label><label class="field"><span>Gepflanzt / angeschafft am</span><input type="date" name="planted" value="${esc(p.planted||'')}"></label><label class="field"><span>Hauptfoto</span><input type="file" id="mainupload" accept="image/*"><small class="muted">Fotos werden für die lokale Speicherung verkleinert.</small></label><div class="card"><h3>Icon für die Gartenkarte</h3><p class="mapnote">Lade ein Foto oder eine Illustration hoch und wähle den quadratischen Ausschnitt.</p><div class="iconrow"><div id="iconpreview" class="iconpreview">${p.iconPhoto?`<img src="${p.iconPhoto}" alt="Aktuelles Icon">`:'🌱'}</div><div class="grow"><input id="iconfile" type="file" accept="image/*" onchange="chooseIconFile(this)"><input id="iconvalue" type="hidden" value="${p.iconPhoto||''}"><button type="button" class="btn ghost" onclick="removeIconCrop()">Icon entfernen</button></div></div><div id="cropwrap" hidden><p class="mapnote">Verschiebe den Bildausschnitt durch Tippen. Mit dem Regler kannst du zoomen.</p><img id="cropimage" hidden alt=""><canvas id="cropcanvas" width="240" height="240" onclick="cropMove(event)" aria-label="Quadratischen Ausschnitt festlegen"></canvas><label class="field"><span>Zoom</span><input type="range" min="1" max="3" step="0.05" value="1" oninput="iconZoom(this.value)"></label><button type="button" class="btn secondary" onclick="acceptIconCrop()">Ausschnitt übernehmen</button></div></div><h3>Standort & Wachstum</h3><p class="muted tiny">Tippe einfach auf alle zutreffenden Eigenschaften. Mehrfachauswahl ist möglich.</p><div class="card"><h3>Position auf der Gartenkarte</h3><p class="mapnote">Tippe auf den Gartenplan, um diese Pflanze zu platzieren.</p><div id="editor-map" class="mapframe picking" onclick="pickPlantPosition(event)"><img src="gartenplan.jpg" alt="Hauptgarten und Vorgarten">${editorMarkers(id)}<span id="editor-marker" class="mapmark" style="display:${p.position?'grid':'none'};left:${p.position?.x||0}%;top:${p.position?.y||0}%">${plantMarker(p)}</span></div><input type="hidden" name="mapx" value="${p.position?.x??''}"><input type="hidden" name="mapy" value="${p.position?.y??''}"><button class="btn ghost" type="button" onclick="clearPlantPosition()">Position entfernen</button></div>${fieldsHTML(p)}<div class="actions"><button class="btn" type="submit">Pflanze speichern</button><button class="btn ghost" type="button" onclick="closeDialog()">Abbrechen</button></div></form>`)}function formFields(){let fields={};document.querySelectorAll('[data-field]').forEach(e=>{if(e.type==='checkbox'){if(!fields[e.dataset.field])fields[e.dataset.field]=[];if(e.checked)fields[e.dataset.field].push(e.value)}else fields[e.dataset.field]=e.value});return fields}function imageData(file){return new Promise((res,rej)=>{let r=new FileReader();r.onerror=()=>rej(r.error);r.onload=()=>{let im=new Image();im.onload=()=>{let cv=document.createElement('canvas'),scale=Math.min(1,1400/Math.max(im.width,im.height));cv.width=Math.round(im.width*scale);cv.height=Math.round(im.height*scale);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=r.result};r.readAsDataURL(file)})}async function savePlant(e,id){e.preventDefault();try{let f=e.target,p=plants.find(x=>x.id===id)||{id:uid(),photos:[],created:today()};p.name=f.elements.namedItem('name').value.trim();p.variety=f.elements.namedItem('variety').value;p.type=f.elements.namedItem('type').value;p.planted=f.elements.namedItem('planted').value;p.fields=formFields();p.iconPhoto=document.getElementById('iconvalue').value||'';let mx=f.elements.namedItem('mapx').value,my=f.elements.namedItem('mapy').value;p.position=mx!==''&&my!==''?{x:+mx,y:+my}:null;let file=document.getElementById('mainupload').files[0];if(file)p.mainPhoto=await imageData(file);await put('plants',p);closeDialog();await refresh();plantDetail(p.id)}catch(err){alert('Speichern fehlgeschlagen: '+err.message)}}function plantDetail(id){let p=plants.find(x=>x.id===id);if(!p)return;selectedPlant=id;view='plants';nav();let pa=assignments.filter(a=>a.plantId===id);document.getElementById('app').innerHTML=`<button class="btn ghost" onclick="setView('plants')">← Alle Pflanzen</button><div class="card" style="margin-top:14px">${p.mainPhoto?`<img src="${p.mainPhoto}" style="width:100%;max-height:350px;object-fit:cover;border-radius:12px">`:''}<h2 style="margin-top:14px">${esc(p.name)}</h2><p class="muted">${esc(p.variety||'')} ${p.type?'· '+esc(p.type):''}</p><div class="actions"><button class="btn secondary" onclick="plantEditor('${id}')">Bearbeiten</button><button class="btn ghost" onclick="removePlant('${id}')">Löschen</button></div></div><div class="card"><div class="row"><h2>Fototagebuch</h2><button class="btn secondary" onclick="photoEditor('${id}')">+ Foto</button></div><div class="photogrid">${(p.photos||[]).map((ph,i)=>`<div class="photoitem"><img class="photo" src="${ph.data}" onclick="photoEditor('${id}',${i})"><div>${esc(ph.date||'Ohne Datum')}</div><div class="muted">${esc(ph.note||'')}</div></div>`).join('')||'<p class="muted">Noch keine weiteren Fotos.</p>'}</div></div><div class="card"><h2>Steckbrief</h2>${p.planted?`<p><b>Gepflanzt:</b> ${esc(p.planted)}</p>`:''}${FIELDS.filter(([k])=>{let v=p.fields?.[k];return Array.isArray(v)?v.length:v}).map(([k,l])=>`<p><b>${l}:</b> ${esc(Array.isArray(p.fields[k])?p.fields[k].join(', '):p.fields[k])}</p>`).join('')||'<p class="muted">Noch keine Eigenschaften eingetragen.</p>'}</div><div class="card"><div class="row"><h2>Pflegeaufgaben</h2><button class="btn secondary" onclick="assignmentEditor('${id}')">+ Aufgabe</button></div>${pa.map(a=>`<div class="taskline"><div class="grow"><b>${esc(taskName(a.templateId))}</b><div class="muted tiny">${(a.months||[]).map(m=>MONTHS[m]).join(', ')}</div><div class="tiny">${esc(a.description||'')}</div>${taskName(a.templateId).toLowerCase().includes('düng')?`<div class="fertline">Dünger: ${esc([...(a.fertilizers||[]),a.fertilizerNote].filter(Boolean).join(' · ')||'Noch nicht hinterlegt')}</div>`:''}</div><button class="btn ghost" onclick="assignmentEditor('${id}','${a.id}')">✎</button></div>`).join('')||'<p class="muted">Noch keine Aufgaben zugeordnet.</p>'}</div>`}
async function removePlant(id){if(!confirm('Pflanze und zugeordnete Aufgaben löschen?'))return;for(let a of assignments.filter(a=>a.plantId===id)){await del('assignments',a.id);for(let c of completions.filter(c=>c.assignmentId===a.id))await del('completions',c.id)}await del('plants',id);await refresh()}function photoEditor(id,index){let p=plants.find(p=>p.id===id),ph=index===undefined?{}:p.photos[index];openDialog('Foto im Gartentagebuch',`<form onsubmit="savePhoto(event,'${id}',${index===undefined?-1:index})"><label class="field"><span>Foto ${index===undefined?'*':''}</span><input id="photofile" type="file" accept="image/*" ${index===undefined?'required':''}></label><label class="field"><span>Aufnahmedatum</span><input type="date" name="date" value="${esc(ph.date||today())}"></label><label class="field"><span>Notiz</span><textarea name="note">${esc(ph.note||'')}</textarea></label><div class="actions"><button class="btn">Speichern</button>${index!==undefined?`<button type="button" class="btn danger" onclick="removePhoto('${id}',${index})">Foto löschen</button>`:''}</div></form><p class="muted tiny">Das Datum wird vorgeschlagen und kann anhand der Foto-Informationen manuell korrigiert werden.</p>`)}async function savePhoto(e,id,index){e.preventDefault();let p=plants.find(p=>p.id===id),f=e.target,ph=index<0?{id:uid()}:p.photos[index];let file=document.getElementById('photofile').files[0];if(file)ph.data=await imageData(file);ph.date=f.elements.namedItem('date').value;ph.note=f.elements.namedItem('note').value;if(index<0)p.photos.push(ph);await put('plants',p);closeDialog();await refresh();plantDetail(id)}async function removePhoto(id,index){if(!confirm('Foto löschen?'))return;let p=plants.find(p=>p.id===id);p.photos.splice(index,1);await put('plants',p);closeDialog();await refresh();plantDetail(id)}
function toggleFertilizerFields(el){const t=templates.find(t=>t.id===el.value);document.getElementById('fertilizer-fields').style.display=t?.name?.toLowerCase().includes('düng')?'block':'none'}
function monthChecks(selected=[]){return `<div class="checks">${MONTHS.map((m,i)=>`<label class="check"><input type="checkbox" name="month" value="${i}" ${selected.includes(i)?'checked':''}>${m.slice(0,3)}</label>`).join('')}</div>`}function assignmentEditor(plantId,id){let a=assignments.find(a=>a.id===id)||{plantId,months:[]};openDialog(id?'Pflegeaufgabe bearbeiten':'Pflegeaufgabe zuordnen',`<form onsubmit="saveAssignment(event,'${id||''}','${plantId||''}')"><label class="field"><span>Pflanze</span><select name="plant" required>${plants.map(p=>`<option value="${p.id}" ${p.id===a.plantId?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><label class="field"><span>Aufgabe aus Bibliothek</span><select name="template" required onchange="toggleFertilizerFields(this)"><option value="">Auswählen</option>${templates.map(t=>`<option value="${t.id}" ${t.id===a.templateId?'selected':''}>${esc(t.name)}</option>`).join('')}</select></label><button type="button" class="btn ghost" onclick="templateEditor()">+ Neue Aufgabenvorlage</button><label class="field"><span>Beschreibung für diese Pflanze</span><textarea name="description">${esc(a.description||'')}</textarea></label><div class="field" id="fertilizer-fields" style="display:${taskName(a.templateId).toLowerCase().includes('düng')?'block':'none'}"><span>Düngungsmittel (für Aufgaben „Düngen“)</span><div class="checks">${['Universal','Blühpflanze','Grünpflanze','Spezial','Mineralisch','Organisch'].map(v=>`<label class="check"><input type="checkbox" name="fertilizer" value="${v}" ${(a.fertilizers||[]).includes(v)?'checked':''}>${v}</label>`).join('')}</div><label class="field"><span>Genauer Dünger / Produkt (optional)</span><input name="fertilizerNote" value="${esc(a.fertilizerNote||'')}" placeholder="z. B. Rhododendrondünger"></label></div><label class="field"><span>Ausführungsmonate *</span>${monthChecks(a.months)}</label><div class="actions"><button class="btn">Zuordnung speichern</button>${id?`<button type="button" class="btn danger" onclick="removeAssignment('${id}')">Zuordnung löschen</button>`:''}</div></form>`)}async function saveAssignment(e,id,plantId){e.preventDefault();let f=e.target,months=[...f.querySelectorAll('input[name=month]:checked')].map(e=>+e.value);if(!months.length)return alert('Bitte mindestens einen Monat auswählen.');let a=assignments.find(a=>a.id===id)||{id:uid()};a.plantId=f.elements.namedItem('plant').value;a.templateId=f.elements.namedItem('template').value;a.description=f.elements.namedItem('description').value;a.fertilizers=[...f.querySelectorAll('input[name=fertilizer]:checked')].map(e=>e.value);a.fertilizerNote=f.elements.namedItem('fertilizerNote').value.trim();a.months=months;await put('assignments',a);closeDialog();await refresh();if(plantId)plantDetail(plantId)}async function removeAssignment(id){if(!confirm('Aufgabenzuordnung löschen?'))return;let a=assignments.find(a=>a.id===id);await del('assignments',id);for(let c of completions.filter(c=>c.assignmentId===id))await del('completions',c.id);closeDialog();await refresh();if(a)plantDetail(a.plantId)}function templateEditor(id){let t=templates.find(t=>t.id===id)||{};openDialog(id?'Aufgabenvorlage bearbeiten':'Neue Aufgabenvorlage',`<form onsubmit="saveTemplate(event,'${id||''}')"><label class="field"><span>Bezeichnung *</span><input name="name" required value="${esc(t.name||'')}" placeholder="z. B. Düngen"></label><label class="field"><span>Allgemeine Beschreibung (optional)</span><textarea name="description">${esc(t.description||'')}</textarea></label><button class="btn">Speichern</button></form>`)}async function saveTemplate(e,id){e.preventDefault();let f=e.target,t=templates.find(t=>t.id===id)||{id:uid()};t.name=f.elements.namedItem('name').value.trim();t.description=f.elements.namedItem('description').value;await put('templates',t);closeDialog();await refresh()}async function removeTemplate(id){if(assignments.some(a=>a.templateId===id))return alert('Diese Vorlage wird noch von Pflanzen verwendet. Bitte zuerst die Zuordnungen entfernen.');if(!confirm('Vorlage löschen?'))return;await del('templates',id);await refresh()}
function taskRows(arr,m,y){return arr.map(a=>{let c=done(a,m,y),t=templates.find(t=>t.id===a.templateId);return `<label class="taskline"><input type="checkbox" ${c?'checked':''} onchange="toggleDone('${a.id}',${m},${y},this.checked)"><div class="grow"><b>${esc(plantName(a.plantId))}</b><div class="tiny">${esc(t?.name||'Aufgabe')}${a.description?' · '+esc(a.description):t?.description?' · '+esc(t.description):''}</div>${t?.name?.toLowerCase().includes('düng')?`<div class="fertline">Dünger: ${esc([...(a.fertilizers||[]),a.fertilizerNote].filter(Boolean).join(' · ')||'Noch nicht hinterlegt')}</div>`:''}${c?`<div class="muted tiny">Erledigt am ${esc(c.date)}</div>`:''}</div></label>`}).join('')};async function toggleDone(id,m,y,checked){let c=done(assignments.find(a=>a.id===id),m,y);if(checked&&!c)await put('completions',{id:uid(),assignmentId:id,month:m,year:y,date:today()});if(!checked&&c)await del('completions',c.id);await refresh()};function taskPage(){return `<div class="row"><h2>Gartenkalender</h2><div class="actions"><button class="btn secondary" onclick="year--;render()">‹</button><b>${year}</b><button class="btn secondary" onclick="year++;render()">›</button></div></div><div class="card"><div class="row"><h3>Aufgabenbibliothek</h3><button class="btn secondary" onclick="templateEditor()">+ Vorlage</button></div><div>${templates.map(t=>`<span class="pill" onclick="templateEditor('${t.id}')" style="cursor:pointer">${esc(t.name)} ✎</span>`).join('')||'<span class="muted">Noch keine Vorlagen.</span>'}</div><div class="actions"><button class="btn" onclick="${plants.length?'assignmentEditor()':'alert(\'Bitte zuerst eine Pflanze anlegen.\')'}">+ Aufgabe zuordnen</button></div></div>${MONTHS.map((m,i)=>{let a=assignments.filter(a=>active(a,i)),c=counts(i,year);let groups=[...new Set(a.map(x=>x.templateId))];return `<details class="month" ${i===new Date().getMonth()?'open':''}><summary><span><b>${m}</b> <span class="muted tiny">${c.done}/${c.total} erledigt</span></span><span class="pill">${c.total} To-Dos</span></summary><div class="monthbody">${groups.map(tid=>{let group=a.filter(x=>x.templateId===tid);return `<details class="taskgroup" open><summary>${esc(taskName(tid))} · ${group.length} Pflanzen</summary>${taskRows(group,i,year)}</details>`}).join('')||'<p class="muted tiny">Keine Aufgaben geplant.</p>'}</div></details>`}).join('')}`}
function historyPage(){let years=[...new Set([new Date().getFullYear(),...completions.map(c=>c.year)])].sort((a,b)=>b-a),total=completions.filter(c=>c.year===year).length;return `<div class="row"><h2>Gartenrückblick</h2><select style="width:110px" onchange="year=+this.value;render()">${years.map(y=>`<option ${y===year?'selected':''}>${y}</option>`).join('')}</select></div><div class="grid"><div class="card"><div class="muted tiny">ERLEDIGTE AUFGABEN</div><div class="stat">${total}</div></div><div class="card"><div class="muted tiny">PFLANZEN IM ARCHIV</div><div class="stat">${plants.length}</div></div></div>${MONTHS.map((m,i)=>{let c=completions.filter(c=>c.year===year&&c.month===i);let photos=plants.flatMap(p=>(p.photos||[]).filter(ph=>ph.date?.startsWith(year+'-'+String(i+1).padStart(2,'0'))).map(ph=>({p,ph})));return `<details class="month" ${i===new Date().getMonth()?'open':''}><summary><b>${m}</b><span class="muted tiny">${c.length} erledigt · ${photos.length} Fotos</span></summary><div class="monthbody">${c.map(x=>{let a=assignments.find(a=>a.id===x.assignmentId);return `<div class="taskline"><span>✓</span><div><b>${esc(a?taskName(a.templateId):'Gelöschte Aufgabe')}</b><div class="muted tiny">${esc(a?plantName(a.plantId):'')} · ${esc(x.date)}</div></div></div>`}).join('')}${photos.length?`<div class="photogrid">${photos.map(x=>`<div><img class="photo" src="${x.ph.data}"><div class="tiny">${esc(x.p.name)} · ${esc(x.ph.date)}</div></div>`).join('')}</div>`:''}${!c.length&&!photos.length?'<p class="muted tiny">Keine Einträge.</p>':''}</div></details>`}).join('')}`}
function morePage(){return `<h2>Daten & Sicherung</h2><div class="card"><h3>Vollständiges Backup</h3><p class="muted">JSON-Datei mit Pflanzen, Fotos, Aufgaben, Monatszuordnungen und Erledigungen. Regelmäßig sichern!</p><button class="btn" onclick="exportBackup()">Backup herunterladen</button><label class="field"><span>Backup wiederherstellen (JSON)</span><input type="file" accept=".json,application/json" onchange="importBackup(this.files[0])"></label><p class="note">Beim Wiederherstellen eines vollständigen Backups werden die aktuellen Daten ersetzt. Importierte Pflanzen aus einer Pflanzenliste werden dagegen ergänzt.</p></div><div class="card"><h3>Pflanzenliste</h3><p class="muted">CSV-Datei für Excel oder zur Vorbereitung neuer Einträge. Bilder sind nur im JSON-Backup enthalten.</p><div class="actions"><button class="btn secondary" onclick="exportCSV()">Pflanzen als CSV</button><button class="btn secondary" onclick="exportTemplate()">CSV-Vorlage</button></div><label class="field"><span>Pflanzen aus CSV oder JSON ergänzen</span><input type="file" accept=".csv,.json,text/csv,application/json" onchange="importPlants(this.files[0])"></label></div><div class="card"><h3>Hinweise zur Speicherung</h3><p class="muted tiny">Alle Daten werden lokal in diesem Browser auf diesem Gerät gespeichert. Browserdaten löschen, private Tabs oder ein Gerätewechsel können die Daten entfernen. Die HTML-Datei selbst enthält nicht automatisch deine gespeicherten Pflanzen. Verwende regelmäßig das vollständige JSON-Backup.</p></div>`}
function download(name,content,type){let b=new Blob([content],{type}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}function exportBackup(){download('GardenStudio_Backup_'+today()+'.json',JSON.stringify({format:'garden-studio',version:1,exported:today(),plants,templates,assignments,completions},null,2),'application/json')};function csvCell(v){let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}const CSVHEAD=['id','name','variety','type','planted','iconPhoto',...FIELDS.map(f=>f[0])];function exportCSV(){let rows=[CSVHEAD,...plants.map(p=>CSVHEAD.map(k=>k in p?p[k]:Array.isArray(p.fields?.[k])?p.fields[k].join('|'):p.fields?.[k]||''))];download('GardenStudio_Pflanzen_'+today()+'.csv','\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\r\n'),'text/csv;charset=utf-8')};function exportTemplate(){download('GardenStudio_Importvorlage.csv','\ufeff'+CSVHEAD.map(csvCell).join(';')+'\r\n','text/csv;charset=utf-8')};function parseCSV(text){text=text.replace(/^\ufeff/,'');let sep=(text.split(/\r?\n/)[0].match(/;/g)||[]).length>=(text.split(/\r?\n/)[0].match(/,/g)||[]).length?';':',';let rows=[],row=[],cell='',q=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(q&&text[i+1]==='"'){cell+='"';i++}else q=!q}else if(c===sep&&!q){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x!==''))rows.push(row);row=[];cell=''}else cell+=c}row.push(cell);if(row.some(x=>x!==''))rows.push(row);let head=rows.shift()||[];return rows.map(r=>Object.fromEntries(head.map((h,i)=>[h,r[i]||''])))}async function importPlants(file){if(!file)return;try{let text=await file.text(),raw=file.name.toLowerCase().endsWith('.json')?JSON.parse(text):parseCSV(text);let list=Array.isArray(raw)?raw:raw.plants;if(!Array.isArray(list))throw Error('Keine Pflanzenliste gefunden');let count=0;for(let x of list){if(!x.name)continue;let p={id:uid(),name:x.name,variety:x.variety||'',type:x.type||'',planted:x.planted||'',created:today(),photos:Array.isArray(x.photos)?x.photos:[],mainPhoto:x.mainPhoto||'',iconPhoto:x.iconPhoto||'',fields:{},position:x.position||null};for(let [k] of FIELDS){let v=x.fields?.[k]??x[k]??'';p.fields[k]=Array.isArray(v)?v:typeof v==='string'&&['licht','wind','groesse','wasser','winter','duenger','duengmonate','schnittmonate','bluetemonate','bluete','blatt','herbst'].includes(k)?v.split('|').filter(Boolean):v}await put('plants',p);count++}await refresh();alert(count+' Pflanzen importiert. Bestehende Pflanzen bleiben erhalten.')}catch(e){alert('Import fehlgeschlagen: '+e.message)}}async function importBackup(file){if(!file)return;try{let obj=JSON.parse(await file.text());if(obj.format!=='garden-studio'||!Array.isArray(obj.plants)||!Array.isArray(obj.templates)||!Array.isArray(obj.assignments)||!Array.isArray(obj.completions))throw Error('Kein gültiges Garden-Studio-Backup');if(!confirm('Alle aktuellen Daten durch dieses Backup ersetzen?'))return;let names=['plants','templates','assignments','completions'];let tx=db.transaction(names,'readwrite');for(let n of names){let store=tx.objectStore(n);store.clear();for(let v of obj[n])store.put(v)}await new Promise((res,rej)=>{tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});await refresh();alert('Backup wiederhergestellt.')}catch(e){alert('Wiederherstellung fehlgeschlagen: '+e.message)}}async function init(){try{db=await openDB();await refresh();if(!templates.length){for(let name of TASKS)await put('templates',{id:uid(),name,description:''});await refresh()}}catch(e){document.getElementById('app').innerHTML='<div class="card">Lokale Speicherung ist nicht verfügbar. Öffne die App in einem normalen Browserfenster (nicht im privaten Modus).<br>'+esc(e.message)+'</div>'}}init();
</script></body></html>
